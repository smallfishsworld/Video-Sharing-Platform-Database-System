[versions]
postgresql = '42.7.4'
testcontainers = '1.21.4'
palantir-java-format = '2.50.0'

[libraries]
testcontainers-bom = { module = 'org.testcontainers:testcontainers-bom', version.ref = 'testcontainers' }

[plugins]
spring-boot = { id = 'org.springframework.boot', version = '2.7.16' }
spring-dependencyManagement = { id = 'io.spring.dependency-management', version = '1.0.15.RELEASE' }
lombok = { id = 'io.freefair.lombok', version = '8.4' }
shadow = { id = 'com.github.johnrengelman.shadow', version = '8.1.1' }
spotless = { id = 'com.diffplug.spotless', version = '7.2.1' }
