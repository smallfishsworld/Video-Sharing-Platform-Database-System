# A PostgreSQL 16 database for the runner: user, password and database are all "sustc", as in
# src/main/resources/application.yml. The official image, in the variant that the tests use
# (postgres:16-alpine), keeps its data in ./data/postgresql (ignored by git). If port 5432 is
# taken, start it with SUSTC_DB_PORT=<port> and pass PGPORT=<port> to scripts/benchmark.sh.
services:
  db:
    image: postgres:16-alpine
    # PostgreSQL keeps the shared state of parallel index builds and VACUUM in /dev/shm. Docker's
    # default of 64 MB is too small for the importer's concurrent VACUUM (ANALYZE) runs, which
    # then fail with "could not resize shared memory segment ... No space left on device".
    shm_size: 1gb
    ports:
      - '127.0.0.1:${SUSTC_DB_PORT:-5432}:5432'
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=sustc
      - POSTGRES_PASSWORD=sustc
      - POSTGRES_DB=sustc
